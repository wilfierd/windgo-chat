version: "3.8"

# Dependencies for WindGo Chat (Backend runs on host)
services:
  postgres:
    image: postgres:15-alpine
    container_name: windgo-chat-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: windgo_chat
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d windgo_chat"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - windgo-network

  adminer:
    image: adminer:latest
    container_name: windgo-chat-adminer
    ports:
      - "8082:8080"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - windgo-network

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: windgo-chat-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-}
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - windgo-network

  windgo-backend:
    image: ${DOCKERHUB_USERNAME:-nguyenhieu}/windgo-backend:latest
    build: .
    env_file:
      - /opt/windgo/.env
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=windgo_chat
      - DB_PORT=5432
      - MEILISEARCH_HOST=http://meilisearch:7700
      - CORS_ORIGIN=*
    ports:
      - "8080-8082:8080" # Map 3 containers to 8080, 8081, 8082
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 3
    networks:
      - windgo-network

volumes:
  postgres_data:
  meilisearch_data:

networks:
  windgo-network:
    driver: bridge
