version: "3.7"

services:
  # =========================================================
  # DATABASE: 1 Master + 2 Slave (PostgreSQL Streaming Replication)
  # =========================================================
  postgres-master:
    image: ghcr.io/bitnami/postgresql:15
    container_name: windgo-postgres-master
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: replicatorpass
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: password
      POSTGRESQL_DATABASE: windgo_chat
    ports:
      - "5432:5432"   # App backend kết nối vào đây để GHI
    volumes:
      - postgres_master_data:/bitnami/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d windgo_chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - windgo-network

  postgres-slave1:
    image: ghcr.io/bitnami/postgresql:15
    container_name: windgo-postgres-slave1
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: postgres-master
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: replicatorpass
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: password
    ports:
      - "5433:5432"   # Slave 1 - dùng để đọc (READ)
    volumes:
      - postgres_slave1_data:/bitnami/postgresql
    depends_on:
      - postgres-master
    restart: unless-stopped
    networks:
      - windgo-network

  postgres-slave2:
    image: ghcr.io/bitnami/postgresql:15
    container_name: windgo-postgres-slave2
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: postgres-master
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: replicatorpass
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: password
    ports:
      - "5434:5432"   # Slave 2 - dùng để đọc (READ)
    volumes:
      - postgres_slave2_data:/bitnami/postgresql
    depends_on:
      - postgres-master
    restart: unless-stopped
    networks:
      - windgo-network

  # =========================================================
  # TOOLS
  # =========================================================
  adminer:
    image: adminer:latest
    container_name: windgo-chat-adminer
    ports:
      - "8082:8080"
    depends_on:
      - postgres-master
    restart: unless-stopped
    networks:
      - windgo-network

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: windgo-chat-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-}
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped
    networks:
      - windgo-network

  # =========================================================
  # BACKEND: 3 instances (Load Balanced by Nginx)
  # =========================================================
  windgo-backend:
    image: ${IMAGE}
    env_file:
      - /opt/windgo/.env
    environment:
      - DB_HOST=postgres-master   # Luôn GHI vào Master
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=windgo_chat
      - DB_PORT=5432
      - MEILISEARCH_HOST=http://meilisearch:7700
      - CORS_ORIGIN=*
    ports:
      - "8085-8087:8080"
    depends_on:
      - postgres-master
    deploy:
      replicas: 3
    networks:
      - windgo-network

volumes:
  postgres_master_data:
  postgres_slave1_data:
  postgres_slave2_data:
  meilisearch_data:

networks:
  windgo-network:
    driver: bridge
