version: "3.8"

services:
  backend:
    build: .
    container_name: windgo-chat-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=windgo_chat
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URL=${GITHUB_REDIRECT_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - windgo-network

  postgres:
    image: postgres:15-alpine
    container_name: windgo-chat-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: windgo_chat
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d windgo_chat"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - windgo-network

  adminer:
    image: adminer:latest
    container_name: windgo-chat-adminer
    ports:
      - "8082:8080"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - windgo-network

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: windgo-chat-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-}
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - windgo-network

volumes:
  postgres_data:
  meilisearch_data:

networks:
  windgo-network:
    driver: bridge