name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Trigger on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            # Navigate to the project directory
            cd ~/app/chat-backend-go || exit 1

            # Pull the latest code
            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Check if Go is installed
            if ! command -v go &> /dev/null; then
                echo "ERROR: Go is not installed on the server."
                exit 1
            fi

            # Determine which docker compose command to use
            echo "Checking Docker Compose..."
            if docker compose version >/dev/null 2>&1; then
                COMPOSE_CMD="docker compose"
            elif docker-compose version >/dev/null 2>&1; then
                COMPOSE_CMD="docker-compose"
            else
                echo "ERROR: Neither 'docker compose' nor 'docker-compose' is available"
                exit 1
            fi
            echo "Using: $COMPOSE_CMD"

            # Start dependencies (DB, Search, etc.)
            echo "Starting dependencies..."
            $COMPOSE_CMD up -d postgres meilisearch adminer

            # Build the Go application
            echo "Building Go application..."
            go mod download
            go build -o main main.go

            # Restart the Systemd service
            # Assumes the service file 'windgo-backend.service' has been linked/copied to /etc/systemd/system/
            # and enabled.
            echo "Restarting backend service..."
            if sudo systemctl is-active --quiet windgo-backend; then
                sudo systemctl restart windgo-backend
            else
                echo "WARNING: Service 'windgo-backend' is not active. Attempting to start/enable..."
                # Optional: specific setup if service missing (requires sudo permissions)
                # sudo cp windgo-backend.service /etc/systemd/system/
                # sudo systemctl daemon-reload
                # sudo systemctl enable windgo-backend
                sudo systemctl start windgo-backend || echo "Failed to start service. Check logs."
            fi

            echo "✅ Deployment completed successfully"