name: Docker CI/CD on Self-Hosted

on:
  push:
    branches:
      - dev

env:
  PROJECT_DIR: ${{ vars.PROJECT_DIR }}
  CONTAINER_NAME: windgo-backend
  IMAGE_NAME: windgo-backend-image

jobs:
  test:
    name: Test Code
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        run: |
          set -e
          cd "$PROJECT_DIR"
          git fetch origin dev
          git reset --hard origin/dev

      - name: Validate Code Structure (go vet)
        run: |
          set -e
          cd "$PROJECT_DIR"
          export PATH="$PATH:/usr/local/go/bin"
          go mod tidy
          go vet ./...

      - name: Run Unit Tests
        run: |
          set -e
          cd "$PROJECT_DIR"
          export PATH="$PATH:/usr/local/go/bin"
          go test ./...

  docker:
    name: Docker Metadata + Build & Push
    runs-on: self-hosted
    needs: test
    outputs:
      image_sha_tag: ${{ steps.meta.outputs.version }}
      image_ref: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/windgo-backend
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./chat-backend-go
          file: ./chat-backend-go/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy via Docker (local runner host)
    runs-on: self-hosted
    needs: docker
    steps:
      - name: Stop old container
        run: |
          set -e
          sudo docker stop "$CONTAINER_NAME" || true
          sudo docker rm "$CONTAINER_NAME" || true

      - name: Run new container from Docker Hub latest
        run: |
          set -e
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/windgo-backend:latest"
          
          # 1. Server kéo thẻ Image mới nhất y như cũ!
          sudo docker pull "$IMAGE"
          
          # 2. Deploy bằng compose thay vì docker run để nó nhận lệnh scale=3
          cd "$PROJECT_DIR"
          sudo docker compose up -d --no-build --scale windgo-backend=3

      - name: Wait for healthy container status
        run: |
          set -e

          for i in $(seq 1 30); do
            STATUS="$(sudo docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$CONTAINER_NAME")"
            echo "Attempt $i/30 - health status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy."
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "Container became unhealthy."
              break
            fi

            sleep 3
          done

          echo "Container did not become healthy in time."
          sudo docker ps --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
          sudo docker logs --tail 300 "$CONTAINER_NAME" || true
          exit 1

      - name: Verify deployment info
        run: |
          set -e
          sudo docker ps --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
          sudo docker logs --tail 100 "$CONTAINER_NAME"
