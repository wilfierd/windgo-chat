name: Docker CI/CD on Self-Hosted

on:
  push:
    branches:
      - dev

env:
  PROJECT_DIR: ${{ vars.PROJECT_DIR }}
  CONTAINER_NAME: windgo-backend
  IMAGE_NAME: windgo-backend-image

jobs:
  test:
    name: Test Code
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        run: |
          set -e
          cd "$PROJECT_DIR"
          git fetch origin dev
          git reset --hard origin/dev

      - name: Validate Code Structure (go vet)
        run: |
          set -e
          cd "$PROJECT_DIR"
          export PATH="$PATH:/usr/local/go/bin"
          go mod tidy
          go vet ./...

      - name: Run Unit Tests
        run: |
          set -e
          cd "$PROJECT_DIR"
          export PATH="$PATH:/usr/local/go/bin"
          go test ./...

  docker:
    name: Docker Metadata + Build & Push
    runs-on: self-hosted
    needs: test
    outputs:
      image_sha_tag: ${{ steps.meta.outputs.version }}
      image_ref: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/windgo-backend
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./chat-backend-go
          file: ./chat-backend-go/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy via Docker (local runner host)
    runs-on: self-hosted
    needs: docker
    steps:
      - name: Stop old container
        run: |
          set -e
          sudo docker stop "$CONTAINER_NAME" || true
          sudo docker rm "$CONTAINER_NAME" || true

      - name: Run new container from Docker Hub latest
        run: |
          set -e
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/windgo-backend:latest"
          
          # 1. Server kéo thẻ Image mới nhất y như cũ!
          sudo docker pull "$IMAGE"
          
          # 2. Trỏ thẳng vào đúng lõi Project Git
          cd "$PROJECT_DIR"
          
          # Export IMAGE để docker-compose đọc được biến ${IMAGE} trong file yml
          export IMAGE="$IMAGE"
          
          # Dọn sạch toàn bộ container cũ (kể cả từ lần chạy compose trước)
          sudo -E docker-compose down --remove-orphans || true
          
          # Kéo lên 3 instance mới
          sudo -E docker-compose up -d

      - name: Wait for containers to be running
        run: |
          set -e
          echo "Waiting for windgo-backend replicas to start..."
          sleep 5
          
          # Kiểm tra tất cả các container replica của compose
          REPLICAS=$(sudo docker ps --filter "name=windgo-backend" --format "{{.Names}}")
          COUNT=$(echo "$REPLICAS" | grep -c "windgo-backend" || true)
          echo "Running replicas: $COUNT"
          echo "$REPLICAS"
          
          if [ "$COUNT" -lt 3 ]; then
            echo "Expected 3 replicas, only $COUNT running!"
            sudo docker ps -a --filter "name=windgo-backend"
            sudo docker logs $(sudo docker ps -aq --filter "name=windgo-backend" | head -1) --tail 50 || true
            exit 1
          fi
          echo "All 3 replicas are running!"

      - name: Verify deployment info
        run: |
          set -e
          echo "=== Running containers ==="
          sudo docker ps --filter "name=windgo-backend" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

